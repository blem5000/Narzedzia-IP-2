name: release

# Tag v* pushowany do main: build + testy + paczka + GitHub Release z assetem.
# Zastępuje ręczny build_release.ps1 (zostaje do budowania lokalnego).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: microsoft/setup-msbuild@v3

      - name: Restore NuGet
        run: msbuild "Narzedzia IP 2.sln" -t:restore -p:Configuration=Release -v:minimal -nologo

      - name: Build
        run: msbuild "Narzedzia IP 2.sln" -p:Configuration=Release -v:minimal -nologo

      # Tag musi odpowiadac AssemblyVersion/FileVersion w zbudowanych exe.
      # Bez tego zapomniane podbicie wersji = release z 1.1.25 oznaczony jako
      # v1.1.26, a updater widzi "jestem starszy" i zapetla sie w aktualizacji.
      - name: Verify version matches tag
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag '$tag' nie jest w formacie vX.Y.Z" }
          $expected = $tag -replace '^v', ''
          $files = @(
            "Narzedzia IP 2\bin\Release\Narzedzia IP 2.exe",
            "NarzedziaIP.Updater\bin\Release\NarzedziaIP.Updater.exe"
          )
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { throw "Brak zbudowanego pliku: $f" }
            $raw = (Get-Item $f).VersionInfo.FileVersion
            if ([string]::IsNullOrWhiteSpace($raw)) { throw "Brak FileVersion w pliku: $f" }
            $ver = [System.Version]$raw
            $short = "$($ver.Major).$($ver.Minor).$($ver.Build)"
            if ($short -ne $expected) {
              throw "Wersja nie zgadza sie z tagiem: tag=$expected, a $f ma $raw. Podbij AssemblyVersion i AssemblyFileVersion w 'Narzedzia IP 2\Properties\AssemblyInfo.cs' oraz 'NarzedziaIP.Updater\Properties\AssemblyInfo.cs'."
            }
          }
          Write-Host "Wersja zgodna z tagiem: $expected"

      # Pakowanie - jeden skrypt dla CI i dla lokalnej pracy
      # (build_release.ps1), zeby zawartosc paczki nie rozjechala sie
      # miedzy nimi. Build juz wykonany w kroku powyzej.
      # Pakowanie jest PRZED testami, bo test sciezki aktualizacji
      # sprawdza zbudowana paczke.
      - name: Package
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File build_release.ps1 -SkipBuild
          if (-not (Test-Path "dist\NarzedziaIP2-windows.zip")) { throw "nie powstala paczka" }

      - name: Test
        shell: powershell
        run: |
          $vstest = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.PackageGroup.TestTools.Core -find **\vstest.console.exe | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($vstest)) { throw "vstest.console.exe not found" }
          & $vstest "NarzedziaIP.Tests\bin\Release\NarzedziaIP.Tests.dll"

      # SHA-256 paczki trafia do notatek release'a - aplikacja porownuje go z
      # hashem pobranego pliku i przerywa instalacje przy niezgodnosci.
      # Drugi asset (zip.sha256) to wersja dla czlowieka i skryptow.
      - name: Checksum
        shell: powershell
        run: |
          $zip = "dist\NarzedziaIP2-windows.zip"
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  NarzedziaIP2-windows.zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii -NoNewline
          Write-Host "SHA256: $sha"
          "sha=$sha" >> $env:GITHUB_ENV

      - name: GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "Automatyczny release z CI (build + testy + paczka).`n`nSHA256: $env:sha"
          gh release create $tag "dist\NarzedziaIP2-windows.zip" "dist\NarzedziaIP2-windows.zip.sha256" --title $tag --notes $notes
